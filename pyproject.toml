[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-obsidian-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pypdf>=6.21.4,<7",
  "python-dotenv>=1,<2",
  "python-telegram-bot>=21,<23",
]

[project.optional-dependencies]
test = ["pytest>=9.0.3,<10", "pytest-asyncio>=1.5,<2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
